<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vybeGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow512" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feGaussianBlur stdDeviation="24" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#050508"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#vybeGrad512)" stroke-width="3" stroke-dasharray="6 10" opacity="0.45"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.25"/>
  
  <g filter="url(#glow512)">
    <!-- Audio Wave Arc -->
    <path d="M 120 256 C 150 200, 180 310, 210 240 C 230 190, 256 320, 270 256 C 290 190, 320 310, 340 240 C 360 200, 390 270, 410 256" 
          fill="none" stroke="url(#vybeGrad512)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Monogram 'V' & 'X' -->
    <path d="M 150 150 L 256 360 L 362 150" fill="none" stroke="#00f3ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M 175 330 L 337 175" fill="none" stroke="#ff007f" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M 175 175 L 337 330" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glow512)"/>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#00f3ff" stroke-width="3" opacity="0.8"/>
</svg>
