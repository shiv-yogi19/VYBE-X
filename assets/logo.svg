<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Neon Gradients -->
    <linearGradient id="vybeCyanMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="laserGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.8" />
    </linearGradient>
    <!-- Filters for Neon Bloom -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Backdrop with subtle radial glow -->
  <rect width="400" height="400" rx="48" fill="#050508"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#vybeCyanMagenta)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00f3ff" stroke-width="2" opacity="0.25" />

  <!-- Outer RGB Rings -->
  <g filter="url(#neonBloom)">
    <!-- Dynamic Audio Wave Rings -->
    <path d="M 90 200 C 110 160, 130 240, 150 190 C 170 140, 190 260, 200 200 C 210 140, 230 260, 250 190 C 270 240, 290 160, 310 200" 
          fill="none" stroke="url(#vybeCyanMagenta)" stroke-width="5" stroke-linecap="round"/>

    <!-- Angular Monogram 'V' & 'X' -->
    <path d="M 120 120 L 200 280 L 280 120" fill="none" stroke="#00f3ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 140 260 L 260 140" fill="none" stroke="#ff007f" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M 140 140 L 260 260" fill="none" stroke="url(#laserGlow)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Center Core Pulse -->
  <circle cx="200" cy="200" r="12" fill="#ffffff" filter="url(#neonBloom)"/>
  <circle cx="200" cy="200" r="22" fill="none" stroke="#00f3ff" stroke-width="3" opacity="0.8"/>
  
  <!-- Subtle Laser Ray Cross -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="#00f3ff" stroke-width="1" opacity="0.3" stroke-dasharray="8 6"/>
  <line x1="200" y1="40" x2="200" y2="360" stroke="#ff007f" stroke-width="1" opacity="0.3" stroke-dasharray="8 6"/>
</svg>
